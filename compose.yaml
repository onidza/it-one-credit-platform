services:
  api-gateway:
    build:
      context: ../apigateway
      dockerfile: Dockerfile
    container_name: credit-platform-gateway
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://api-gateway-db:5432/${API_GATEWAY_DB_NAME:-postgres}
      SPRING_DATASOURCE_USERNAME: ${API_GATEWAY_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${API_GATEWAY_DB_PASSWORD:-postgres}

      REST_CREDIT_SERVICE_URL: ${CREDIT_SERVICE_URL:-http://credit-service:8081}
      REST_LOAN_SERVICE_URL: ${LOAN_MANAGEMENT_SERVICE_URL:-http://loan-management-service:8082}

      GRPC_CREDIT_SERVICE_ADDRESS: "credit-service:9091"
    depends_on:
      api-gateway-db:
        condition: service_healthy
      credit-service:
        condition: service_healthy
      loan-management-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - services-net
      - api-gateway-db-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  credit-service:
    build:
      context: ../credit-service
      dockerfile: Dockerfile
    container_name: credit-platform-credit-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://credit-service-db:5432/${CREDIT_SERVICE_DB_NAME:-postgres}
      SPRING_DATASOURCE_USERNAME: ${CREDIT_SERVICE_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${CREDIT_SERVICE_DB_PASSWORD:-postgres}

      REST_LOAN_SERVICE_URL: ${LOAN_MANAGEMENT_SERVICE_URL:-http://loan-management-service:8082}

      S3_ENDPOINT: http://rustfs:9000

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      credit-service-db:
        condition: service_healthy
      loan-management-service:
        condition: service_healthy
    networks:
      - services-net
      - credit-service-db-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  loan-management-service:
    build:
      context: ../loan-management-service
      dockerfile: Dockerfile
    container_name: credit-platform-loan-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://loan-management-service-db:5432/${LOAN_MANAGEMENT_SERVICE_DB_NAME:-postgres}
      SPRING_DATASOURCE_USERNAME: ${LOAN_MANAGEMENT_SERVICE_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${LOAN_MANAGEMENT_SERVICE_DB_PASSWORD:-postgres}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      loan-management-service-db:
        condition: service_healthy
    networks:
      - services-net
      - loan-management-service-db-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-gateway-db:
    image: postgres:18
    container_name: api-gateway-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${API_GATEWAY_DB_NAME:-postgres}
      POSTGRES_USER: ${API_GATEWAY_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${API_GATEWAY_DB_PASSWORD:-postgres}
    volumes:
      - api-gateway-db:/var/lib/postgresql
    networks:
      - api-gateway-db-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  credit-service-db:
    image: postgres:18
    container_name: credit-service-db
    restart: unless-stopped

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

    environment:
      POSTGRES_DB: ${CREDIT_SERVICE_DB_NAME:-postgres}
      POSTGRES_USER: ${CREDIT_SERVICE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${CREDIT_SERVICE_DB_PASSWORD:-postgres}
    volumes:
      - credit-service-db:/var/lib/postgresql
    networks:
      - credit-service-db-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  loan-management-service-db:
    image: postgres:18
    container_name: loan-management-service-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOAN_MANAGEMENT_SERVICE_DB_NAME:-postgres}
      POSTGRES_USER: ${LOAN_MANAGEMENT_SERVICE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${LOAN_MANAGEMENT_SERVICE_DB_PASSWORD:-postgres}
    volumes:
      - loan-management-service-db:/var/lib/postgresql
    networks:
      - loan-management-service-db-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - services-net

  debezium-connect:
    image: quay.io/debezium/connect:3.5
    container_name: debezium-connect
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-connect

      CONFIG_STORAGE_TOPIC: debezium-connect-configs
      OFFSET_STORAGE_TOPIC: debezium-connect-offsets
      STATUS_STORAGE_TOPIC: debezium-connect-status

      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    networks:
      - services-net
      - credit-service-db-net

  debezium-init:
    image: alpine:3.20
    container_name: debezium-init
    depends_on:
      debezium-connect:
        condition: service_started
      credit-service-db:
        condition: service_healthy
    environment:
      DB_USER: ${CREDIT_SERVICE_DB_USER:-postgres}
      DB_PASSWORD: ${CREDIT_SERVICE_DB_PASSWORD:-postgres}
      DB_NAME: ${CREDIT_SERVICE_DB_NAME:-postgres}
    volumes:
      - ./infra/kafka-connect/connector/credit-service-connector.json.tpl:/config/connector.json.tpl:ro

    entrypoint: [ "/bin/sh", "-ec" ]
    command:
      - |
        apk add --no-cache curl gettext

        until curl -fsS http://debezium-connect:8083/connectors > /dev/null; do
          echo "Waiting for Kafka Connect..."
          sleep 2
        done

        envsubst < /config/connector.json.tpl > /tmp/connector.json

        curl -fsS -X PUT \
          http://debezium-connect:8083/connectors/credit-service-connector/config \
          -H "Content-Type: application/json" \
          --data-binary @/tmp/connector.json
    networks:
      - services-net
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: rustfs
    ports:
      - "9001:9001" #for manual local upload
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: password123
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    networks:
      services-net:

volumes:
  api-gateway-db:
  credit-service-db:
  loan-management-service-db:
  kafka_data:
  rustfs_data:

networks:
  services-net:
    driver: bridge

  api-gateway-db-net:
    driver: bridge

  credit-service-db-net:
    driver: bridge

  loan-management-service-db-net:
    driver: bridge